<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - To-Do List</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h2 id="formTitle">Welcome Back</h2>
            <p class="auth-subtitle" id="formSubtitle">Login to continue to your To-Do List</p>

            <div class="auth-message" id="authMessage"></div>

            <form id="loginForm" class="auth-form">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" placeholder="you@example.com" required>

                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" required>

                <button type="submit" class="auth-button">Login</button>
            </form>

            <form id="registerForm" class="auth-form hidden">
                <label for="registerName">Full Name</label>
                <input type="text" id="registerName" placeholder="John Doe" required>

                <label for="registerAge">Age</label>
                <input type="number" id="registerAge" placeholder="Enter your age" min="1" required>

                <label for="registerEmail">Email</label>
                <input type="email" id="registerEmail" placeholder="you@example.com" required>

                <label for="registerPassword">Password</label>
                <input type="password" id="registerPassword" placeholder="Create a password" required>

                <label for="registerConfirmPassword">Confirm Password</label>
                <input type="password" id="registerConfirmPassword" placeholder="Re-enter your password" required>

                <button type="submit" class="auth-button">Create Account</button>
            </form>

            <p class="auth-toggle" id="toggleToRegister">
                Don't have an account? <a href="#" id="showRegister">Create Account</a>
            </p>
            <p class="auth-toggle hidden" id="toggleToLogin">
                Already have an account? <a href="#" id="showLogin">Login</a>
            </p>
        </div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
